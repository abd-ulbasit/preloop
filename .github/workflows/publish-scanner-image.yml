# Builds the opt-in scanner agent image (environments/scanner, issue #705).
#
# Publishing runs on version tags, or an explicit manual scanner recovery:
# a v* tag push builds linux/amd64 and linux/arm64, pushes
# ghcr.io/preloop/preloop-codex-scanner and prints the published digest to
# the job summary. Manual recovery publishes an existing release tag from
# the selected recipe commit, without moving latest or changing the git tag.
# The daily schedule, default manual runs and pull requests that
# touch the recipe are dry runs: they
# resolve the current advisory database digest, build, smoke the image with
# --network none and print what would be published, without pushing.
#
# The smoke builds on the small fetch base instead of the 10 GB Codex base,
# which does not fit a hosted runner's disk. The publish build adds files to
# the Codex base with COPY --link only, so BuildKit never unpacks the base.
# Set file permissions in the fetch stage; --chmod on that final COPY
# disables the linked-layer optimization and exhausts the runner's disk.

name: Publish Scanner Image

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the scanner image for an existing release tag'
        type: boolean
        default: false
      release_tag:
        description: 'Existing release tag for manual publishing (for example v0.17.0)'
        type: string
        default: ''
  # Pull requests that touch the recipe build and smoke it (never push).
  pull_request:
    paths:
      - 'environments/scanner/**'
      - '.github/workflows/publish-scanner-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/preloop-codex-scanner
  # Same digest as the FETCH_IMAGE default in environments/scanner/Dockerfile.
  SMOKE_BASE: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258

jobs:
  scanner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve publication target
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash environments/scanner/resolve-publication.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve advisory database digest
        id: db
        run: echo "ref=$(environments/scanner/resolve-db-digest.sh)" >> "$GITHUB_OUTPUT"

      - name: Build smoke image
        env:
          DB_REF: ${{ steps.db.outputs.ref }}
        run: |
          docker buildx build --load -f environments/scanner/Dockerfile \
            --build-arg CODEX_BASE_IMAGE="$SMOKE_BASE" \
            --build-arg TRIVY_DB_REPOSITORY="$DB_REF" \
            -t preloop-codex-scanner:smoke .

      - name: Smoke offline
        run: environments/scanner/run-smoke.sh preloop-codex-scanner:smoke

      - name: Log in to Container Registry
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: steps.publication.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: environments/scanner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TRIVY_DB_REPOSITORY=${{ steps.db.outputs.ref }}
          # Manual recovery never moves latest; stable tag pushes still do.
          tags: |
            ${{ env.IMAGE }}:${{ steps.publication.outputs.release_tag }}
            ${{ steps.publication.outputs.publish_latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}

      - name: Record digest
        env:
          DB_REF: ${{ steps.db.outputs.ref }}
          PUBLISHED: ${{ steps.push.outputs.digest }}
          PUBLISH: ${{ steps.publication.outputs.publish }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
          RECIPE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Scanner image"
            echo
            echo "- Recipe commit: \`$RECIPE_SHA\`"
            echo "- Advisory database: \`$DB_REF\`"
            if [ "$PUBLISH" = "true" ]; then
              echo "- Image tag: \`$RELEASE_TAG\`"
              echo "- Published: \`$IMAGE@$PUBLISHED\`"
              echo
              echo "Register \`$IMAGE@$PUBLISHED\` as the profile \`image\`, see docs/guide/flows/scanner-image.md."
            else
              echo "- Dry run: publishing was not requested, nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
